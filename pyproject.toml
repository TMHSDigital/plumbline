[project]
name = "plumbline"
version = "0.1.0"
description = "Choose and configure a decision model on your own labeled data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "TMHSDigital" }]
keywords = ["calibration", "classification", "evaluation", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Each floor is the oldest release the whole test suite passes on, checked by
# the lowest-direct job in CI. The SDKs are capped below their next breaking
# series, since an adapter depends on their request and response shapes.
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.1",
    "typer>=0.16",
    "typesafe-sdk>=0.5.7,<0.8",
    "anthropic>=0.77,<2",
]

[project.optional-dependencies]
# Local checkpoints are opt-in so plumbline installs and runs hosted-only on a
# machine with no GPU.
local = [
    "torch>=2.5",
    "transformers>=4.46",
]

[project.scripts]
plumbline = "plumbline.cli:app"

[project.urls]
Homepage = "https://github.com/TMHSDigital/plumbline"
Source = "https://github.com/TMHSDigital/plumbline"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # The CLI tests read stderr apart from stdout, which Click's test runner
    # does from 8.2.
    "click>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/plumbline"]

[[tool.mypy.overrides]]
# torch and transformers are the optional [local] extra. plumbline type-checks
# on a machine that has neither, so the local readout's imports are unresolved
# there rather than wrong.
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
