[project]
name = "plumbline"
version = "0.1.0.dev0"
description = "Choose and configure a decision model on your own labeled data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "TMHSDigital" }]
keywords = ["calibration", "classification", "evaluation", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "typer>=0.15",
    "httpx>=0.28",
    "typesafe-sdk>=0.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Local checkpoints are opt-in so plumbline installs and runs hosted-only on a
# machine with no GPU.
local = [
    "torch>=2.5",
    "transformers>=4.46",
]

[project.scripts]
plumbline = "plumbline.cli:app"

[project.urls]
Homepage = "https://github.com/TMHSDigital/plumbline"
Source = "https://github.com/TMHSDigital/plumbline"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/plumbline"]
